# Exemple de préproduction. Adapter les chemins, le domaine, les certificats
# et le socket PHP-FPM avant installation. Ce fichier n'est jamais exécuté ici.

server {
    listen 80;
    listen [::]:80;
    server_name moni.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name moni.example.com;

    root /var/www/moni/frontend;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/moni.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moni.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src 'self'; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Lucide is imported as native ES modules; Nginx must emit the module MIME type.
    location ~ \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # PHP endpoints only; no directory listing or static source exposure.
    location ~ ^/backend/(?:lib|tests|migrations)/ { deny all; }
    location ~ ^/backend/test-db { deny all; }
    location ~ ^/backend/(?:schema\.sql|\.env(?:\..*)?|.*\.(?:sql|log|ini|bak))$ { deny all; }
    location ~ ^/backend/.*\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/moni$fastcgi_script_name;
        fastcgi_param HTTPS on;
        # Dedicated Moni PHP-FPM pool. Do not switch the active vhost until
        # the pool, permissions and rollback procedure have been validated.
        fastcgi_pass unix:/run/php/moni-fpm.sock;
    }
    location /backend/ { return 404; }
}
