server {
    listen 8443 ssl;
    server_name localhost;

    root /var/www/moni/frontend;
    index index.html;

    ssl_certificate /etc/nginx/tls/localhost.crt;
    ssl_certificate_key /etc/nginx/tls/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MONI_TLS:2m;
    ssl_session_tickets off;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src 'self'; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location ~ \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    location ~ ^/backend/(?:lib|tests|migrations)/ { return 404; }
    location ~ ^/backend/test-db { return 404; }
    location ~ ^/(?:deployment|migrations|tests|ops|release)(?:/|$) { return 404; }
    location ~ ^/backend/vendor(?:/|$) { return 404; }
    location ~ ^/backend/(?:schema\.sql|\.env(?:\..*)?|.*\.(?:sql|log|ini|bak))$ { return 404; }

    location ~ ^/backend/.*\.php$ {
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/moni$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass moni-fpm:9000;
    }

    location /backend/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
